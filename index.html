<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Platform Lelang Online Terpercaya - Delcom Auction" />
    <title>Delcom Auction</title>

    <!-- DNS Prefetch & Preconnect untuk koneksi cepat ke API & Google Fonts -->
    <link rel="dns-prefetch" href="https://open-api.delcom.org" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />

    <!-- Google Fonts dengan teknik Non-Render-Blocking (Asynchronous) -->
    <link 
      rel="preload" 
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400;1,600&display=swap" 
      as="style" 
      onload="this.onload=null;this.rel='stylesheet'"
    />
    <noscript>
      <link 
        rel="stylesheet" 
        href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400;1,600&display=swap"
      />
    </noscript>
  </head>
  <body class="bg-slate-50 text-slate-900 font-sans antialiased min-h-screen">
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
